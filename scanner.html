<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner Barcode - Prima Aircold</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#0b1120;color:#f1f5f9;font-family:Arial,sans-serif}
.wrap{max-width:560px;margin:auto;background:#172337;border:1px solid #334155;border-radius:14px;padding:18px}
h2{margin:0 0 8px;font-size:20px}p{color:#94a3b8;font-size:13px;line-height:1.5}
video{width:100%;max-height:430px;background:#000;border-radius:10px;object-fit:cover;margin-top:12px}
button{border:0;border-radius:8px;padding:12px 16px;font-weight:bold;color:#fff;background:#2563eb;cursor:pointer;margin:6px 5px 0 0}
.stop{background:#991b1b}#status{padding:11px;border-radius:8px;background:#1e293b;color:#cbd5e1}#result{font-size:17px;font-weight:bold;word-break:break-all;color:#86efac}
</style>
</head>
<body>
<div class="wrap">
  <h2>Scanner Barcode Unit AC</h2>
  <p>Arahkan barcode serial number ke kamera. Setelah terbaca, hasil dikirim kembali ke aplikasi inventaris Prima Aircold.</p>
  <div id="status">Menyiapkan kamera...</div>
  <video id="preview" autoplay muted playsinline></video>
  <button id="startBtn">Mulai Kamera</button>
  <button id="stopBtn" class="stop">Tutup Kamera</button>
  <p id="result"></p>
</div>
<script type="module">
import { BrowserMultiFormatReader } from "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm";

const video = document.getElementById("preview");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const target = new URLSearchParams(location.search).get("target") || "serial";
let reader = null, controls = null, busy = false;

function errorText(err) {
  const name = err && err.name;
  if (name === "NotAllowedError" || name === "PermissionDeniedError")
    return "Izin kamera ditolak. Klik ikon kamera di alamat Chrome dan pilih Izinkan.";
  if (name === "NotFoundError" || name === "DevicesNotFoundError")
    return "Kamera tidak ditemukan pada perangkat ini.";
  if (name === "NotReadableError" || name === "TrackStartError")
    return "Kamera sedang dipakai aplikasi lain atau tidak dapat diakses.";
  if (name === "OverconstrainedError")
    return "Kamera tidak mendukung pengaturan video yang diminta.";
  return "Gagal membuka kamera: " + (err && err.message ? err.message : String(err));
}

async function startCamera() {
  if (busy || controls) return;
  busy = true;
  statusEl.textContent = "Meminta izin kamera...";
  resultEl.textContent = "";

  try {
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia)
      throw new Error("Halaman scanner harus dibuka melalui HTTPS di Chrome.");

    // Akses kamera diminta dari halaman top-level yang tidak berada di iframe Apps Script.
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await video.play();

    if (!reader) reader = new BrowserMultiFormatReader();
    statusEl.textContent = "Kamera aktif. Arahkan barcode ke kamera.";

    controls = await reader.decodeFromVideoElement(video, (result) => {
      if (!result || !busy) return;
      const code = result.getText().trim();
      if (!code) return;

      resultEl.textContent = "Terbaca: " + code;
      statusEl.textContent = "Barcode berhasil dibaca. Mengirim hasil...";
      stopCamera();

      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: "PRIMA_BARCODE_RESULT", text: code, target }, "*");
        statusEl.textContent = "Hasil dikirim ke aplikasi inventaris. Tab ini dapat ditutup.";
      } else {
        statusEl.textContent = "Aplikasi inventaris tidak ditemukan. Buka scanner dari tombol Scan di aplikasi.";
      }
    });
    busy = false;
  } catch (err) {
    busy = false;
    stopCamera();
    statusEl.textContent = errorText(err);
  }
}

function stopCamera() {
  try { if (controls && typeof controls.stop === "function") controls.stop(); } catch (e) {}
  controls = null;
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
    video.srcObject = null;
  }
}

document.getElementById("startBtn").addEventListener("click", startCamera);
document.getElementById("stopBtn").addEventListener("click", () => {
  stopCamera(); busy = false; statusEl.textContent = "Kamera ditutup.";
});
window.addEventListener("beforeunload", stopCamera);
startCamera();
</script>
</body>
</html>
